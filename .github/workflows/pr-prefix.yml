name: Auto-prefix PR Title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  prefix-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Add prefix to PR title
        uses: actions/github-script@v7
        with:
          script: |
            const fn = require('./.github/scripts/prefix-pr-title.js');
            await fn({ github, context });
